
name: Automated Survey Data Pipeline

on:
  schedule:
    # Daily at 15:40 UTC
    - cron: "40 13 * * *"
      timezone: "Europe/Riga" 
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  survey-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Google Sheets credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path

          credentials = json.loads(
              os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]
          )

          credentials_path = (
              Path(tempfile.gettempdir()) / "google-service-account.json"
          )

          credentials_path.write_text(
              json.dumps(credentials),
              encoding="utf-8"
          )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(
                  f"GOOGLE_APPLICATION_CREDENTIALS={credentials_path}\n"
              )
          PY

      - name: Run survey ETL and ADF pipeline
        env:
          SURVEY_SOURCE: google
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_STORAGE_ACCOUNT: stsurveygenaidev01
          AZURE_STORAGE_CONTAINER: survey-data
          AZURE_RESOURCE_GROUP: rg-survey-genai-dev
          AZURE_DATA_FACTORY: adf-survey-genai-dev
          AZURE_PIPELINE_NAME: pl_survey_cleaned_to_analytics
        run: |
          python -m app.automation